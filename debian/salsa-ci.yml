include:
  - $CI_SERVER_URL/apt/salsa-ci/raw/pios/salsa-ci.yml

variables:
  RELEASE: 'trixie'
  # Run lintian from the above release
  SALSA_CI_IMAGES_LINTIAN: ${SALSA_CI_IMAGES}/lintian:${RELEASE}
  # Make that build quicker
  # DEB_BUILD_PROFILES: pkg.linux.quick
  # We have to bump the version in source preparation, not later
  SALSA_CI_DISABLE_VERSION_BUMP: 'true'
  # Output is limited to 4 MiB total, so use 'terse'.
  DEB_BUILD_OPTIONS: 'terse parallel=auto'
  SALSA_CI_SBUILD_VERBOSE: 'false'

# Add stages for signed packages
stages:
  - provisioning
  - build
  - publish
  - sign-code
  - build-signed
  - test

orig:
  stage: provisioning
  image: $SALSA_CI_IMAGES_BASE
  cache:
    key: "orig-${RELEASE}"
    paths:
      - orig
  extends:
    - .artifacts-default-expire
  except:
    variables:
      - $CI_COMMIT_TAG != null
  artifacts:
    reports:
      dotenv: shas.env
  script:
    - rm -f ../linux*.tar*

    # Move orig tarball cache
    - |
      if [ -d orig ]; then
          mv orig/* .. || true
          rmdir orig
      fi

    - apt-get update
    - eatmydata apt-get install --no-install-recommends -y curl devscripts git jq

    # Record whether pios/$RELEASE-base and pios/$RELEASE-beta-base
    # were in sync at pipeline start. sync-beta-base reads
    # BETA_BASE_WAS_SYNCED at release-promotion time to decide whether
    # to push -next -> -beta-base or preserve staged divergence.
    - |
      api="$CI_API_V4_URL/projects/$CI_PROJECT_ID/repository/branches"
      auth="JOB-TOKEN: $CI_JOB_TOKEN"
      base_sha=$(curl -sS -H "$auth" "$api/pios%2F${RELEASE}-base" | jq -r .commit.id)
      beta_base_sha=$(curl -sS -H "$auth" "$api/pios%2F${RELEASE}-beta-base" | jq -r .commit.id)
      if [ "$base_sha" = "$beta_base_sha" ]; then
          echo "BETA_BASE_WAS_SYNCED=1" > shas.env
      else
          echo "BETA_BASE_WAS_SYNCED=0" > shas.env
      fi

    # Fail loudly if RELEASE drifts from debian/changelog
    - |
      changelog_dist=$(dpkg-parsechangelog --show-field=distribution)
      if [ "$changelog_dist" != "$RELEASE" ]; then
          echo "RELEASE='$RELEASE' in debian/salsa-ci.yml does not match debian/changelog distribution '$changelog_dist'" >&2
          echo "Update one or the other to match." >&2
          exit 1
      fi

    - USCAN_VCS_EXPORT_UNCOMPRESSED=yes origtargz -dt

    # Move orig tarballs back to where GitLab wants them
    - mkdir orig
    - find .. -maxdepth 1 -name '*.orig.tar.*' ! \( -name '*.asc' -o -name '*.sig' -o -name '*.sign' \) -exec mv {} orig/ \;

# Our modified build jobs

build source:
  timeout: 3 hours
  cache:
    - key: "orig-${RELEASE}"
      paths:
        - orig
      policy: pull
  needs:
    - job: orig
  extends:
    - .build-definition
  variables:
    DB_BUILD_TYPE: source
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    - when: always
  script:
    - !reference [.build-before-script]
    - !reference [.build-script-setup-environment]

    # Move orig tarball cache
    - |
      if [ -d orig ]; then
          mv orig/* ${BUILD_DIR}/
          rmdir orig
      fi

    # Install dependencies of gencontrol.py and debian/rules orig
    - apt-get update
    - |
      eatmydata apt-get install --no-install-recommends -y \
        debhelper \
        kernel-wedge \
        python3 \
        python3-dacite \
        python3-debian \
        python3-jinja2 \
        quilt \
        rsync

    - source=$(dpkg-parsechangelog -SSource)
    - version=$(dpkg-parsechangelog -SVersion)
    - upstream_version=$(echo $version | sed 's/-[^-]*$//')

    # Export source to build directory
    - |
      git archive --format=tar --prefix=${source}-${upstream_version}/ HEAD \
        | tar -C ${BUILD_DIR} -x
    - cd ${BUILD_DIR}/${source}-${upstream_version}

    # Fudge source version and distribution *before* gencontrol.py
    # - sed -i -e '1 s/) [^;]*/+salsaci) UNRELEASED/' debian/changelog
    # - version=${version}+salsaci

    # Merge upstream source
    - debian/rules orig

    # Build source package
    - dpkg-buildpackage -uc -us -S -sa -d

    # Publish the full source set as artefacts (strip epoch for filename)
    - dcmd mv ../${source}_${version#*:}_source.changes ${WORKING_DIR}
  after_script:
    # pass the RELEASE_FROM_CHANGELOG envvar to any consecutive job
    - echo "RELEASE_FROM_CHANGELOG=${RELEASE_FROM_CHANGELOG}" | tee ${CI_PROJECT_DIR}/salsa.env
    - ls -l ${CI_PROJECT_DIR}/salsa.env
    - cat ${CI_PROJECT_DIR}/salsa.env
    - !reference [.build-after-script]

build:
  timeout: 3 hours
  needs:
    - job: build source
      artifacts: true
  extends:
    - .build-definition
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    - when: always
  variables:
    SALSA_CI_SBUILD_ARGS: '--arch-any --no-arch-all'
  script:
    - !reference [.build-before-script]
    - !reference [.build-script-setup-environment]

    # Extract the canonical .dsc produced by 'build source'
    - source=$(dpkg-parsechangelog -SSource)
    - DSC=$(basename ${WORKING_DIR}/${source}_*.dsc)
    - dpkg-source -x --no-check ${WORKING_DIR}/${DSC} ${BUILD_DIR}/${DSC%.dsc}
    - cd ${BUILD_DIR}/${DSC%.dsc}

    # Make everything accessible to build user
    - chown -R 'salsa-ci:' ${BUILD_DIR} ${WORKING_DIR}

    - !reference [.build-script-setup-build-command]
    - !reference [.build-script-run-build-command]

    # Drop source files forwarded from 'build source' so they're not
    # republished in this binary build's artifacts
    - dcmd rm -f ${WORKING_DIR}/${source}_*_source.changes

build-armhf:
  extends: build
  image: $SALSA_CI_IMAGES_BUILD_ARM32V7
  variables:
    BUILD_ARCH: 'armhf'
    SALSA_CI_SBUILD_ARGS: '--arch-any --no-arch-all'

build-all:
  extends: build
  variables:
    SALSA_CI_SBUILD_ARGS: '--arch-all --no-arch-any'

# The folllowing jobs are the standard tests, excluding any that
# require building again

.lintian-template:
  extends: .test-lintian
  timeout: 2 hours
  script:
  - lintian --suppress-tags 'unreleased-changes,changelog-distribution-does-not-match-changes-file' --suppress-tags "${SALSA_CI_LINTIAN_SUPPRESS_TAGS}" --display-info --pedantic --fail-on error --allow-root ${SALSA_CI_LINTIAN_SHOW_OVERRIDES_ARG} ${SALSA_CI_LINTIAN_ARGS} ${WORKING_DIR}/*.changes | tee lintian.output || ECODE=$?
  - lintian2junit.py --lintian-file lintian.output > ${WORKING_DIR}/lintian.xml
  - exit ${ECODE-0}

lintian-source:
  extends: .lintian-template
  needs:
  - job: build source
    artifacts: true

lintian-arm64:
  extends: .lintian-template
  needs:
  - job: build
    artifacts: true
  # - job: build-signed
  #   artifacts: true

lintian-armhf:
  extends: .lintian-template
  needs:
  - job: build-armhf
    artifacts: true
  # - job: build-signed
  #   artifacts: true

lintian-all:
  extends: .lintian-template
  needs:
  - job: build-all
    artifacts: true

autopkgtest-arm64:
  extends: .test-autopkgtest
  needs:
  - job: build source
    artifacts: true
  - job: build
    artifacts: true
  - job: build-all
    artifacts: true
  # - job: build-signed
  #   artifacts: true

autopkgtest-armhf:
  extends: .test-autopkgtest-armhf
  needs:
  - job: build source
    artifacts: true
  - job: build-armhf
    artifacts: true
  - job: build-all
    artifacts: true
  # - job: build-signed
  #   artifacts: true

blhc:
  extends: .test-blhc
  needs:
  - job: build
    artifacts: true
  - job: build-armhf
    artifacts: true
  - job: build-all
    artifacts: true
  # - job: build-signed
  #   artifacts: true

piuparts-arm64:
  extends: .test-piuparts
  needs:
  - job: build
    artifacts: true
  - job: build-all
    artifacts: true
  # - job: build-signed
  #   artifacts: true

piuparts-armhf:
  extends: .test-piuparts
  variables:
    SALSA_CI_IMAGES_BASE: $SALSA_CI_IMAGES_BASE_ARM32V7
  needs:
  - job: build-armhf
    artifacts: true
  - job: build-all
    artifacts: true
  # - job: build-signed
  #   artifacts: true

missing-breaks:
    extends: .test-missing-breaks

rc-bugs:
    extends: .test-rc-bugs

# Python static checkers

python-static:
  stage: test
  image: $SALSA_CI_IMAGES_BASE
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    - when: always
  script:
    - |
      apt-get update && eatmydata apt-get install --no-install-recommends -y \
        flake8 python3 python3-dacite python3-jinja2 python3-pytest

    # Check Python modules under debian/lib and Python scripts under
    # debian/bin or debian/rules.d.
    - sources="$(mktemp)"
    - find debian/lib/python -name '*.py' > "$sources"
    - |
      find debian/bin debian/rules.d -type f -perm /111 |
          while read script; do
              if awk '/^#!.*python/ { exit 0 } { exit 1 }' "$script"; then
                  echo "$script"
              fi
          done \
          >> "$sources"

    # Run both checkers and coalesce their results rather than exiting
    # on first failure
    - pass=true
    - xargs flake8 --max-line-length=100 < "$sources" || pass=false
    - pytest debian/lib/python || pass=false
    - $pass
  needs: []

# kconfig static check

kconfig-static:
  stage: test
  image: $SALSA_CI_IMAGES_BASE
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    - when: always
  script:
    # Unpack source and apply featureset patches
    - |
      apt-get update && eatmydata apt-get install --no-install-recommends -y \
        debhelper dpkg-dev git python3 python3-dacite quilt
    - dpkg-source -x ${WORKING_DIR}/*.dsc ${WORKING_DIR}/${SOURCE_DIR}
    - cd ${WORKING_DIR}/${SOURCE_DIR}
    - debian/rules source

    # Fetch kernel-team repository
    - kernel_team_dir="$(mktemp -d)"
    - |
      git clone --depth=1 https://salsa.debian.org/kernel-team/kernel-team.git \
        "$kernel_team_dir"

    # Run process.py and treat any error output as a failure
    - error_log="$(mktemp)"
    - |
      "$kernel_team_dir"/utils/kconfigeditor2/process.py . 2>"$error_log" \
      || true
    - |
      if [ -s "$error_log" ]; then cat "$error_log"; false; fi
  needs:
    - job: build source
      artifacts: true

# Sign code with the test key and certificate, build and test that

sign-code:
  stage: sign-code
  image: $SALSA_CI_IMAGES_BASE
  extends:
    - .artifacts-default-expire
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    # - when: always
  script:
    - |
      apt-get update && eatmydata apt-get install --no-install-recommends -y \
        dpkg-dev git openssl python3 python3-debian sbsigntool

    # Fetch kernel-team repository
    - kernel_team_dir="$(mktemp -d)"
    - |
      git clone --depth=1 https://salsa.debian.org/kernel-team/kernel-team.git \
        "$kernel_team_dir"

    # Sign the code and build a source package
    - |
      "$kernel_team_dir"/scripts/debian-test-sign \
        ${WORKING_DIR}/linux*_${BUILD_ARCH}.changes \
        debian/certs/ci-test-sign/ci-test-sign-key.pem \
        debian/certs/ci-test-sign/ci-test-sign.pem
  artifacts:
    paths:
      - ${WORKING_DIR}/linux-signed*-${BUILD_ARCH}_*
  needs:
    - job: build
      artifacts: true

build-signed:
  stage: build-signed
  extends:
    - .build-definition
  rules:
    - if: $CI_COMMIT_TAG != null
      when: never
    # - when: always
  variables:
    SALSA_CI_DPKG_BUILDPACKAGE_ARGS: ''
    # We need linux-image-*-unsigned_*_${BUILD_ARCH}.deb build-dependencies
    # from build job
    SALSA_CI_SBUILD_EXTRA_PACKAGE: '${WORKING_DIR}/'
  script:
    # Do the same as the common .build-definition script
    - !reference [.build-before-script]
    - !reference [.build-script-setup-environment]

    # Move source to build directory and unpack it
    - dcmd mv ${WORKING_DIR}/linux-signed*-${BUILD_ARCH}_*.dsc ${BUILD_DIR}
    - cd ${BUILD_DIR}
    - dpkg-source -x linux-signed*-${BUILD_ARCH}_*.dsc
    - cd linux-signed*-${BUILD_ARCH}-*

    # Make everything accessible to build user
    - chown -R 'salsa-ci:' ${BUILD_DIR} ${WORKING_DIR}

    - !reference [.build-script-setup-build-command]
    - !reference [.build-script-run-build-command]
  after_script:
    - !reference [.build-after-script]
  artifacts:
    # This should include the linux-signed source package, its binary
    # packages, and (for piuparts) the versioned dependencies produced
    # by the build job
    paths:
      - ${WORKING_DIR}/linux-signed*-${BUILD_ARCH}_*
      - ${WORKING_DIR}/linux-base-*_${BUILD_ARCH}.deb
      - ${WORKING_DIR}/linux-headers-*_${BUILD_ARCH}.deb
      - ${WORKING_DIR}/linux-headers-*-common_*_all.deb
      - ${WORKING_DIR}/linux-image-*_${BUILD_ARCH}.deb
      - ${WORKING_DIR}/linux-kbuild-*_${BUILD_ARCH}.deb
      - ${WORKING_DIR}/kernel-image-*_${BUILD_ARCH}.udeb
    exclude:
      - ${WORKING_DIR}/linux-image-*-unsigned_*_${BUILD_ARCH}.deb
  needs:
    - job: build
      artifacts: true
    - job: sign-code
      artifacts: true

publish-internal-main:
