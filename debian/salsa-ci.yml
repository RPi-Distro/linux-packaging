      artifacts: true
    - job: lintian-source
      artifacts: false
    - job: lintian-arm64
      artifacts: false
    - job: lintian-armhf
      artifacts: false
    - job: lintian-all
      artifacts: false
    - job: blhc
      artifacts: false
    - job: piuparts-arm64
      artifacts: false
    - job: piuparts-armhf
      artifacts: false
    - job: python-static
      artifacts: false
    - job: kconfig-static
      artifacts: false

publish-public-main:
  extends: .publish-public
  variables:
    DEPLOY_TARGET: 'public'
    DEPLOY_COMPONENT: 'main'
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/ && $CI_DEPLOY_FREEZE
      when: manual
