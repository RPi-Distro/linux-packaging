# Promote $RELEASE-beta-next -> $RELEASE-beta on a green publish-public-beta.
# Authenticates with `$CI_JOB_TOKEN`; requires Settings -> CI/CD ->
# "Allow Git push requests to the repository" to be enabled, and the
# user who triggered the pipeline must have push permission to the
# target protected branch (the job token inherits their access).
# Job-token pushes don't trigger pipelines, so no `-o ci.skip` is needed.
promote-beta:
  stage: publish
  image: $SALSA_CI_IMAGES_BASE
  variables:
    # Full history so the fast-forward check against pios/$RELEASE-beta
    # has the ancestry it needs (default GIT_DEPTH=1 means just HEAD).
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-beta-next$/ && $CI_DEPLOY_FREEZE
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-beta-next$/
      when: on_success
  needs:
    - job: publish-public-beta
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y git
    - git push --force "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/pios/${RELEASE}-beta"

# Promote $RELEASE-next -> $RELEASE (canonical history) AND reset
# $RELEASE-base to the just-released tip. $RELEASE-base is a resolution
# branch that always starts the next cycle from the latest release,
# so the reset is unconditional. Same gating + credentials as
# promote-beta.
promote-main:
  stage: publish
  image: $SALSA_CI_IMAGES_BASE
  variables:
    # Full history so the fast-forward check against pios/$RELEASE has the
    # ancestry it needs (default GIT_DEPTH=1 means just HEAD).
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/ && $CI_DEPLOY_FREEZE
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/
      when: on_success
  needs:
    - job: publish-public-main
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y git
    - URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git push "$URL" "HEAD:refs/heads/pios/${RELEASE}"
    - git push "$URL" "HEAD:refs/heads/pios/${RELEASE}-base"

# Conditionally push $RELEASE-next -> $RELEASE-beta-base after
# promote-main. Reads BETA_BASE_WAS_SYNCED from the dotenv exported by
# orig: pushes only if $RELEASE-base and $RELEASE-beta-base were already
# in sync at pipeline start. Otherwise skips and logs - staged beta
# divergence is preserved.
sync-beta-base:
  stage: publish
  image: $SALSA_CI_IMAGES_BASE
  variables:
    # Full history so the fast-forward check against pios/$RELEASE-beta-base
    # has the ancestry it needs.
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/ && $CI_DEPLOY_FREEZE
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/
      when: on_success
  needs:
    - job: orig
      artifacts: true
    - job: promote-main
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y git
    - |
      if [ "$BETA_BASE_WAS_SYNCED" = "1" ]; then
          git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:refs/heads/pios/${RELEASE}-beta-base"
      else
          echo "$RELEASE-base diverged from $RELEASE-beta-base at orig time; preserving staged divergence"
      fi

# Mirror the released packaging to GitHub: push HEAD to pios/$RELEASE
# and a pios/<version> tag. Requires two CI variables:
#   GITHUB_PACKAGING_REPO        owner/name of the target GitHub repo
#   GITHUB_PACKAGING_PUSH_TOKEN  masked GitHub PAT, write access to that repo
mirror-to-github:
  stage: publish
  image: $SALSA_CI_IMAGES_BASE
  variables:
    # Full history so dpkg-parsechangelog has the changelog and the tag
    # can be created against the actual release commit.
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/ && $CI_DEPLOY_FREEZE
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/
      when: on_success
  needs:
    - job: promote-main
  script:
    - apt-get update && eatmydata apt-get install --no-install-recommends -y devscripts git
    - |
      if [ -z "$GITHUB_PACKAGING_REPO" ]; then
          echo "GITHUB_PACKAGING_REPO not set; cannot push tag" >&2
          exit 1
      fi
    - version=$(dpkg-parsechangelog -SVersion)
    - tag="pios/${version//:/%}"
    - git config user.email "ci@raspberrypi.invalid"
    - git config user.name "Raspberry Pi CI"
    - git tag -m "Release ${version}" "${tag}"
    - git push "https://x-access-token:${GITHUB_PACKAGING_PUSH_TOKEN}@github.com/${GITHUB_PACKAGING_REPO}.git" "HEAD:refs/heads/pios/${RELEASE}" "${tag}"

# ---------------------------------------------------------------------------
# GitHub commit status reporting. Posts to GitHub's Statuses API as the
# pipeline progresses, against the kernel commit being built. See
# README.md in the linux-build-bridge repo for the context lifecycle.
#
# Required CI variables (project settings):
#   GITHUB_KERNEL_REPO          GitHub repo for the kernel source.
#   GITHUB_KERNEL_STATUS_TOKEN  GitHub PAT (masked), "Commit statuses:
#                               Write" on the kernel repo.
# The commit SHA the statuses get posted against is parsed from the
# "Linux commit:" line that rpi/update writes into debian/changelog.
# ---------------------------------------------------------------------------

# Hidden top-level keys hold the rule lists for each notify-* job.
# !reference resolves these as whole lists at the rules: position; the
# original nested-key form (.rules.notify-start etc.) silently produces
# empty rules and the jobs get excluded from the pipeline. when: lives
# inside each rule because the job-level + rules-level interaction is
# under-documented.

# notify-start fires at pipeline start. Default when:on_success is fine.
.notify-start-rules:
  - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+(-beta)?-next$/

# notify-build, notify-test, notify-deploy each fire at the end of a
# phase. when:always so they post a failure status when the phase failed.
.notify-phase-rules:
  - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+(-beta)?-next$/
    when: always

# notify-released fires after the release-promotion cascade. Release
# branch only; when:always so failures get reported too.
.notify-released-rules:
  - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/
    when: always

.gh-status:
  image: $SALSA_CI_IMAGES_BASE
  before_script:
    - apt-get update
    - eatmydata apt-get install --no-install-recommends -y curl jq
    - |
      FLOW=
      case "$CI_COMMIT_REF_NAME" in
        pios/*-beta-next) FLOW=beta ;;
        pios/*-next)      FLOW=release ;;
      esac
      GITHUB_KERNEL_SHA=$(sed -n 's/.*Linux commit:[[:space:]]*\([0-9a-fA-F]\{7,40\}\).*/\1/p' debian/changelog | head -1)
      [ -n "$GITHUB_KERNEL_SHA" ] || { echo "no 'Linux commit:' line in debian/changelog" >&2; exit 1; }
      gh_status() {
        local state="$1" context="$RELEASE/$2" description="$3"
        : "${GITHUB_KERNEL_REPO:?must be set}"
        : "${GITHUB_KERNEL_STATUS_TOKEN:?must be set}"
        local payload
        payload=$(jq -nc \
          --arg state "$state" --arg context "$context" \
          --arg description "$description" \
          '{state:$state, context:$context, description:$description}')
        curl -sS --fail-with-body -X POST \
          -H "Authorization: Bearer $GITHUB_KERNEL_STATUS_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$GITHUB_KERNEL_REPO/statuses/$GITHUB_KERNEL_SHA" \
          -d "$payload"
      }
      job_status() {
        curl -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?per_page=100" \
          | jq -r --arg n "$1" '.[] | select(.name == $n) | .status' | head -1
      }
      failed_in_stage() {
        curl -sS -H "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/pipelines/$CI_PIPELINE_ID/jobs?per_page=100" \
          | jq -r --arg s "$1" \
              '[.[] | select(.stage == $s and .status == "failed") | .name] | join(", ")'
      }

notify-start:
  extends: .gh-status
  stage: provisioning
  needs: []
  rules:
    - !reference [.notify-start-rules]
  script:
    - |
      case "$FLOW" in
        beta)
          gh_status pending beta-built    "Building"
          gh_status pending beta-tested   "Awaiting tests"
          gh_status pending beta-released "Awaiting publish"
          ;;
        release)
          gh_status pending release-built  "Building"
          gh_status pending release-tested "Awaiting tests"
          gh_status pending release-staged "Awaiting publish"
          ;;
      esac

notify-build:
  extends: .gh-status
  stage: test
  rules:
    - !reference [.notify-phase-rules]
  script:
    - |
      ctx="${FLOW}-built"
      failed=$(failed_in_stage build)
      if [ -z "$failed" ]; then
        gh_status success "$ctx" "Built"
      else
        gh_status failure "$ctx" "Failed: $failed"
      fi

notify-test:
  extends: .gh-status
  stage: publish
  rules:
    - !reference [.notify-phase-rules]
  script:
    - |
      ctx="${FLOW}-tested"
      failed=$(failed_in_stage test)
      if [ -z "$failed" ]; then
        gh_status success "$ctx" "Tested"
      else
        gh_status failure "$ctx" "Failed: $failed"
      fi

notify-deploy:
  extends: .gh-status
  stage: notify
  rules:
    - !reference [.notify-phase-rules]
  needs:
    - job: publish-public-beta
      artifacts: false
      optional: true
    - job: promote-beta
      artifacts: false
      optional: true
    - job: publish-internal-main
      artifacts: false
      optional: true
  script:
    - |
      check_all_green() {
        local label="$1" success_msg="$2"; shift 2
        local failed=""
        for j in "$@"; do
          st=$(job_status "$j")
          [ -z "$st" ] && continue
          [ "$st" = success ] && continue
          [ "$st" = skipped ] && continue
          failed="${failed:+$failed, }$j"
        done
        if [ -z "$failed" ]; then
          gh_status success "$label" "$success_msg"
        else
          gh_status failure "$label" "Failed: $failed"
        fi
      }
      case "$FLOW" in
        beta)
          check_all_green beta-released "Released to beta" \
            publish-public-beta promote-beta
          ;;
        release)
          check_all_green release-staged "Staged for release" \
            publish-internal-main
          # Park 'released' at pending only if release-staged actually succeeded.
          if [ "$(job_status publish-internal-main)" = success ]; then
            gh_status pending released "Ready for release"
          fi
          ;;
      esac

notify-released:
  extends: .gh-status
  stage: notify
  rules:
    - !reference [.notify-released-rules]
  # Only depend on mirror-to-github (tail of the release-promotion
  # cascade). publish-public-main is `when: manual`, which GitLab treats
  # as terminal for needs: purposes, so depending on it directly causes
  # notify-released to fire too early - before the bridge plays the
  # publish job - and report a spurious failure.
  needs:
    - job: mirror-to-github
      artifacts: false
  script:
    - |
      failed=""
      for j in publish-public-main promote-main sync-beta-base mirror-to-github; do
        st=$(job_status "$j")
        [ -z "$st" ] && continue
        [ "$st" = success ] && continue
        [ "$st" = skipped ] && continue
        failed="${failed:+$failed, }$j"
      done
      if [ -z "$failed" ]; then
        gh_status success released "Released"
      else
        gh_status failure released "Release failed: $failed"
      fi
