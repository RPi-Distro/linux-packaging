      when: manual
      allow_failure: true
    - if: $CI_COMMIT_REF_NAME =~ /^pios\/[a-z]+-next$/
      when: on_success
  needs:
    - job: build source
      artifacts: true
    - job: build
      artifacts: true
    - job: build-armhf
      artifacts: true
    - job: build-all
      artifacts: true
    - job: lintian-source
      artifacts: false
    - job: lintian-arm64
      artifacts: false
    - job: lintian-armhf
      artifacts: false
    - job: lintian-all
      artifacts: false
    - job: blhc
      artifacts: false
    - job: piuparts-arm64
      artifacts: false
    - job: piuparts-armhf
