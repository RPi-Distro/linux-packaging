[[flavour]]
name = 'arm64'
[flavour.defs]
is_default = true
[flavour.description]
hardware = '64-bit ARMv8 machines'
[flavour.packages]
installer = true

[[flavour]]
name = 'cloud-arm64'
[flavour.build]
config = ['config.cloud']
[flavour.defs]
is_quick = true
[flavour.description]
hardware = 'arm64 cloud'
hardware_long = 'cloud platforms supporting arm64 virtual machines'

[[flavour]]
name = 'arm64-16k'
[flavour.build]
config = ['arm64/config-page-16k']
[flavour.description]
hardware = '64-bit ARMv8 machines with 16k pages'

[[flavour]]
name = 'v8'
[flavour.description]
hardware = 'Raspberry Pi v8'
hardware_long = 'Raspberry Pi v8 kernel'

[[flavour]]
name = '2712'
[flavour.description]
hardware = 'Raspberry Pi 2712'
hardware_long = 'Raspberry Pi 2712 kernel'

[[featureset]]
name = 'rpi'
[[featureset.flavour]]
name = 'v8'
[[featureset.flavour]]
name = '2712'

[build]
compiler_gnutype_compat = 'arm-linux-gnueabihf'
enable_signed = false
enable_vdso = true
kernel_file = 'arch/arm64/boot/Image.gz'
kernel_stem = 'vmlinuz'
